purpose:
  stands_in_for: Cloudflare Workers AI Clef REST execution, using synthetic credentials and deterministic output.
  unblocks: Local transport, safe failure, authorization and browser-effect verification without live AI usage.
assumptions:
  - id: typed-choice-contract
    status: supported
    claim: The hosted endpoint accepts state and a typed Choice, returning a selected ID and probabilities.
    reason: The official schema and recorded live evaluations agree on this format.
    verification: Read the provider schema and inspected the user's completed November 6 live evaluations. The stand-in does not measure model quality.
    source: https://developers.cloudflare.com/workers-ai/models/clef/; docs/saint-ai.md; backend/src/emoji/clef.ts
    updated_at: '2026-11-06'
  - id: prompt-enforces-default-variants
    status: contradicted
    claim: Instructions alone always prevent non-default skin variants.
    reason: A live English request selected a dark-skinned thumbs-up despite the default-only instruction.
    verification: The broader live run had one variant violation. Candidate filtering and final validation are required in the caller.
    source: docs/saint-ai.md; backend/src/emoji/catalog.ts; backend/test/emoji.test.ts
    updated_at: '2026-11-06'
  - id: caller-simulation
    status: supported
    claim: The changed caller safely handles success, quota errors and prohibited results in the local scenarios exercised.
    reason: The real browser and backend caller traversed the stand-in over HTTP and produced the expected local effect or safe error.
    verification: On November 6, the simulation log recorded two success calls for an emoji, one 429 call without retry, and one unsafe-ID call that produced AI_INVALID_RESPONSE with no effect. Two browser tabs proved requester-only display. Separate real-HTTP tests cover timeout, redirect and malformed JSON. Live integration of the default-filtered catalog remains pending.
    source: backend/test/emoji.test.ts; postman/mocks/clef/default.js
    updated_at: '2026-11-06'
fingerprints:
  - id: local-feature-draft
    date: '2026-11-06'
    commit: 483c78b3702c55be42a978982ac1af560128b1c4 with uncommitted Saint feature changes
    cli: 1.77.0
