name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    outputs:
      artifact_name:
        value: ${{ jobs.checks.outputs.artifact_name }}
      archive_sha256:
        value: ${{ jobs.checks.outputs.archive_sha256 }}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test, build, and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BACKEND_URL: https://talkmato.azther0z.online
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Validate workflows and deployment code
        run: |
          python3 deploy/lint-workflows.py
          python3 -m unittest discover -s infra/gcp/tests
          python3 -m unittest discover -s deploy/tests
          for script in deploy/*.sh infra/bootstrap/*.sh infra/gcp/*.sh; do bash -n "$script"; done
      - name: Validate Terraform without cloud access
        run: |
          for directory in infra/gcp infra/bootstrap; do
            terraform -chdir="$directory" fmt -check
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
      - name: Verify backend
        run: |
          npm --prefix backend ci
          npm --prefix backend run typecheck
          npm --prefix backend test
      - name: Verify and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run lint
          npm --prefix frontend run build
      - name: Package the tested main revision
        id: package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 deploy/build-release.py --commit "$SOURCE_SHA" --output "$RUNNER_TEMP/release"
          archive_sha=$(cut -d ' ' -f 1 "$RUNNER_TEMP/release/talkmato-release.tar.gz.sha256")
          python3 deploy/verify-release.py "$RUNNER_TEMP/release/talkmato-release.tar.gz" \
            "$archive_sha" "$SOURCE_SHA" "$RUNNER_TEMP/release/verified"
          python3 deploy/check-package.py "$RUNNER_TEMP/release/verified"
          printf 'archive_sha256=%s\nartifact_name=talkmato-%s-%s-%s\n' \
            "$archive_sha" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Store the immutable app release
        if: steps.package.outputs.artifact_name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/release/talkmato-release.tar.gz*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
