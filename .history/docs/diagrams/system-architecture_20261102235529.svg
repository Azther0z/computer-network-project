<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title description">
  <title id="title">System Architecture — Simple Chat Application</title>
  <desc id="description">Two separate physical computers run browser clients with Next.js UI. HTTP or HTTPS loads the UI from the Next.js server. Each browser connects directly to the same Java Spring Boot WebSocket endpoint using WebSocket or WSS with JSON chat events. The endpoint exchanges events with chat application logic, which reads and updates in-memory connections, users, rooms, groups and memberships. AI integration is an optional future extension outside mandatory message delivery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#244e73"/></marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67778a"/></marker>
    <style>
      text {font-family: Arial, Helvetica, sans-serif; fill: #19334d;}
      .title {font-size: 34px; font-weight: 700;}
      .layer {font-size: 23px; font-weight: 700; letter-spacing: 1px;}
      .heading {font-size: 27px; font-weight: 700;}
      .body {font-size: 24px;}
      .small {font-size: 22px; fill: #45586d;}
      .label {font-size: 23px; font-weight: 600;}
      .boundary {stroke: #bccbd9; stroke-width: 2;}
      .component {fill: #ffffff; stroke: #557794; stroke-width: 2;}
      .flow {fill: none; stroke: #244e73; stroke-width: 3; marker-end: url(#arrow);}
      .both {marker-start: url(#arrow);}
    </style>
  </defs>
  <rect width="1600" height="1130" fill="#ffffff"/>
  <text x="40" y="48" class="title">System Architecture — Simple Chat Application</text>
  <text x="1560" y="48" text-anchor="end" class="small">Socket Programming · Planned design</text>

  <rect x="40" y="85" width="1520" height="215" rx="4" fill="#edf4fa" class="boundary"/>
  <text x="65" y="120" class="layer">CLIENT LAYER</text>
  <text x="1535" y="120" text-anchor="end" class="small">Two separate physical computers</text>
  <rect x="100" y="150" width="540" height="120" rx="3" class="component"/>
  <text x="370" y="192" text-anchor="middle" class="heading">Client A · Physical Computer A</text>
  <text x="370" y="235" text-anchor="middle" class="body">Browser with Next.js UI</text>
  <rect x="960" y="150" width="540" height="120" rx="3" class="component"/>
  <text x="1230" y="192" text-anchor="middle" class="heading">Client B · Physical Computer B</text>
  <text x="1230" y="235" text-anchor="middle" class="body">Browser with Next.js UI</text>

  <rect x="490" y="335" width="620" height="185" rx="4" fill="#f3f5f7" class="boundary"/>
  <text x="800" y="380" text-anchor="middle" class="layer">WEB APPLICATION LAYER</text>
  <rect x="580" y="395" width="440" height="95" rx="3" class="component"/>
  <text x="800" y="432" text-anchor="middle" class="heading">Next.js Server</text>
  <text x="800" y="469" text-anchor="middle" class="body">Serves the web UI</text>
  <path d="M 550 270 V 440 H 580" class="flow"/>
  <path d="M 1050 270 V 440 H 1020" class="flow"/>
  <rect x="420" y="305" width="260" height="55" fill="#ffffff"/>
  <text x="550" y="325" text-anchor="middle" class="label">HTTP/HTTPS</text>
  <text x="550" y="351" text-anchor="middle" class="small">Load Web UI</text>
  <rect x="920" y="305" width="260" height="55" fill="#ffffff"/>
  <text x="1050" y="325" text-anchor="middle" class="label">HTTP/HTTPS</text>
  <text x="1050" y="351" text-anchor="middle" class="small">Load Web UI</text>

  <rect x="40" y="555" width="1520" height="510" rx="4" fill="#edf4fa" class="boundary"/>
  <text x="280" y="590" class="layer">CHAT SERVER LAYER</text>
  <text x="1100" y="590" text-anchor="middle" class="small">One shared Java Spring Boot instance</text>
  <rect x="140" y="625" width="1320" height="75" rx="3" class="component"/>
  <text x="800" y="655" text-anchor="middle" class="heading">WebSocket Endpoint (/ws)</text>
  <text x="800" y="685" text-anchor="middle" class="small">Receives client events · Sends server events</text>

  <path d="M 230 270 V 625" class="flow both"/>
  <path d="M 1370 270 V 625" class="flow both"/>
  <rect x="55" y="432" width="350" height="76" fill="#ffffff"/>
  <text x="230" y="459" text-anchor="middle" class="label">WebSocket/WSS</text>
  <text x="230" y="491" text-anchor="middle" class="body">JSON Chat Events</text>
  <rect x="1195" y="432" width="350" height="76" fill="#ffffff"/>
  <text x="1370" y="459" text-anchor="middle" class="label">WebSocket/WSS</text>
  <text x="1370" y="491" text-anchor="middle" class="body">JSON Chat Events</text>

  <path d="M 800 700 V 755" class="flow both"/>
  <text x="825" y="735" class="small">Dispatch events / Return results</text>
  <rect x="140" y="755" width="1320" height="115" rx="3" class="component"/>
  <text x="170" y="789" class="heading">Chat Application Logic</text>
  <text x="170" y="825" class="body">Connection and User Management</text>
  <text x="170" y="854" class="body">Room and Group Management</text>
  <text x="805" y="825" class="body">Message Routing</text>
  <text x="805" y="854" class="body">Membership Validation and Authorization</text>

  <path d="M 640 870 V 925" class="flow both"/>
  <text x="665" y="904" class="small">Read / Update state</text>
  <rect x="140" y="925" width="1000" height="100" rx="3" class="component"/>
  <text x="170" y="959" class="heading">In-memory State</text>
  <text x="170" y="990" class="body">Active WebSocket connections · Online users</text>
  <text x="170" y="1017" class="body">Rooms · Groups · Memberships</text>

  <path d="M 1325 870 V 925" fill="none" stroke="#67778a" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#optional-arrow)" marker-end="url(#optional-arrow)"/>
  <rect x="1190" y="925" width="270" height="100" rx="3" fill="#ffffff" stroke="#67778a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1325" y="954" text-anchor="middle" class="label">AI Integration</text>
  <text x="1325" y="982" text-anchor="middle" class="small">Optional · Future</text>
  <text x="1325" y="1010" text-anchor="middle" class="small">e.g. chat summarization</text>

  <text x="40" y="1100" class="small">JSON is the message data format. HTTPS/WSS apply when TLS is configured.</text>
  <text x="1560" y="1100" text-anchor="end" class="small">Chat traffic bypasses Next.js Server.</text>
</svg>
